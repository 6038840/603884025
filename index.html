<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f8fb" />
  <title>湖北省住房供应链｜抽奖活动管理 3.0 原型</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-soft: #eaf3ff;
      --primary-deep: #0958d9;
      --success: #20a66a;
      --warning: #e59b20;
      --danger: #e44b43;
      --purple: #7a59d1;
      --ink: #20242a;
      --text: #414751;
      --muted: #7f8997;
      --line: #e5e9ef;
      --line-strong: #d7dde5;
      --surface: #fff;
      --canvas: #f5f7fa;
      --sidebar: 232px;
      --topbar: 64px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 1080px; min-height: 100%; margin: 0; color: var(--text); background: var(--canvas); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(22,119,255,.18);
      outline-offset: 1px;
    }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 40;
      height: var(--topbar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px 0 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(14px);
      box-shadow: 0 2px 12px rgba(42,58,78,.04);
    }

    .brand { display: flex; align-items: center; gap: 12px; color: #20242a; font-weight: 850; font-size: 21px; }
    .brand-mark {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #fff;
      background: #ef2535;
      box-shadow: 0 7px 16px rgba(226, 40, 54, .2);
      font-size: 23px;
    }
    .account-button {
      display: flex;
      align-items: center;
      gap: 9px;
      border: 0;
      color: #3f444c;
      background: transparent;
      font-weight: 650;
    }
    .account-avatar {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg,#138ee9,#67c3ff);
      font-size: 15px;
    }

    .sidebar {
      position: fixed;
      top: var(--topbar);
      bottom: 0;
      left: 0;
      z-index: 30;
      width: var(--sidebar);
      padding: 16px 0;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: #fff;
      transition: width .2s ease;
    }
    .sidebar.collapsed { width: 72px; }
    .sidebar.collapsed .nav-text,
    .sidebar.collapsed .nav-chevron,
    .sidebar.collapsed .nav-group-title { display: none; }
    .sidebar.collapsed .nav-item { justify-content: center; padding-inline: 0; }
    .sidebar.collapsed .sub-nav { padding-left: 0; }

    .collapse-btn {
      width: 40px;
      height: 34px;
      margin: 0 16px 16px;
      border: 0;
      border-radius: 8px;
      color: #8b98aa;
      background: #f6f8fb;
      font-size: 19px;
    }

    .nav-group-title { padding: 0 22px 9px; color: #a1a9b5; font-size: 11px; }
    .nav-item {
      width: 100%;
      min-height: 47px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      border: 0;
      color: #404650;
      background: transparent;
      text-align: left;
      font-size: 14px;
    }
    .nav-item:hover { background: #f7f9fc; }
    .nav-item.active { color: var(--primary); background: #edf7ff; font-weight: 700; }
    .nav-icon { width: 22px; flex: 0 0 22px; text-align: center; color: #8091a8; font-size: 18px; }
    .nav-item.active .nav-icon { color: var(--primary); }
    .nav-text { flex: 1; }
    .nav-chevron { color: #93a0b2; }
    .sub-nav { padding: 3px 0 3px 34px; }
    .sub-nav .nav-item { min-height: 43px; padding-left: 20px; font-size: 13px; }

    .main {
      min-height: 100vh;
      margin-left: var(--sidebar);
      padding: calc(var(--topbar) + 22px) 24px 36px;
      transition: margin-left .2s ease;
    }
    .main.expanded { margin-left: 72px; }
    .page { max-width: 1600px; margin: 0 auto; }

    .breadcrumb { margin-bottom: 10px; color: #8a95a4; font-size: 12px; }
    .breadcrumb button { padding: 0; border: 0; color: var(--primary); background: transparent; }
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .page-header h1 { margin: 0; color: #1f2328; font-size: 25px; letter-spacing: -.02em; }
    .page-header p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .header-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 9px; }

    .btn {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: #424852;
      background: #fff;
      font-size: 12px;
      font-weight: 650;
    }
    .btn:hover { border-color: #9dbce7; color: var(--primary); }
    .btn.primary { border-color: var(--primary); color: #fff; background: var(--primary); box-shadow: 0 5px 12px rgba(22,119,255,.15); }
    .btn.primary:hover { background: var(--primary-deep); }
    .btn.danger { border-color: #f1b9b6; color: var(--danger); background: #fff; }
    .btn.warning { border-color: #f1d08f; color: #b87505; background: #fffaf0; }
    .btn.small { min-height: 30px; padding: 0 9px; font-size: 11px; }
    .btn.link { min-height: 28px; padding: 0 5px; border-color: transparent; color: var(--primary); background: transparent; }
    .btn[disabled] { cursor: not-allowed; opacity: .46; }

    .metric-grid { display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)); gap: 14px; margin-bottom: 16px; }
    .metric-card {
      min-height: 112px;
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
    }
    .metric-label { color: #6e7784; font-size: 12px; }
    .metric-value { margin-top: 10px; color: #24282e; font-size: 27px; font-weight: 800; }
    .metric-note { margin-top: 6px; color: #9aa3af; font-size: 10px; }

    .card {
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      box-shadow: 0 7px 22px rgba(45, 61, 81, .035);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 60px;
      padding: 13px 18px;
      border-bottom: 1px solid var(--line);
    }
    .card-header h2 { margin: 0; color: #262a30; font-size: 17px; }
    .card-header p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .card-body { padding: 18px; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filters { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .control {
      height: 36px;
      padding: 0 11px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: #3f4650;
      background: #fff;
      font-size: 12px;
    }
    input.control { min-width: 210px; }
    select.control { min-width: 130px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      height: 46px;
      padding: 0 12px;
      color: #596373;
      background: #f6f8fb;
      font-weight: 700;
      text-align: left;
      white-space: nowrap;
    }
    td { min-height: 50px; padding: 12px; border-bottom: 1px solid #edf0f4; vertical-align: middle; }
    tbody tr:hover { background: #fafcff; }
    tbody tr:last-child td { border-bottom: 0; }
    .cell-main { color: #2e333a; font-weight: 650; }
    .cell-sub { margin-top: 3px; color: #929ba8; font-size: 10px; }
    .nowrap { white-space: nowrap; }
    .row-actions { display: flex; align-items: center; gap: 5px; white-space: nowrap; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.active { color: #168357; background: #e7f8f0; }
    .status.paused { color: #7a55c6; background: #f0ebff; }
    .status.upcoming { color: #b07b11; background: #fff5d8; }
    .status.ended { color: #7b8491; background: #eef1f4; }
    .status.waiting { color: #b36c00; background: #fff2d6; }
    .status.contact { color: #176dcc; background: #e8f2ff; }
    .status.unreachable { color: #cf493f; background: #ffedeb; }
    .status.claimed { color: #168357; background: #e7f8f0; }

    .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 14px; color: #8a94a2; font-size: 11px; }
    .page-btn { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 6px; color: #59616c; background: #fff; }
    .page-btn.active { border-color: var(--primary); color: #fff; background: var(--primary); }

    .tabs {
      display: flex;
      align-items: center;
      gap: 25px;
      min-height: 50px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .tab {
      align-self: stretch;
      position: relative;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      color: #626c79;
      background: transparent;
      font-size: 12px;
    }
    .tab.active { color: var(--primary); font-weight: 700; }
    .tab.active::after { content: ""; position: absolute; right: 0; bottom: 0; left: 0; height: 2px; background: var(--primary); }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .detail-block { padding: 16px; border: 1px solid var(--line); border-radius: 9px; }
    .detail-block h3 { margin: 0 0 13px; color: #30353c; font-size: 14px; }
    .kv-grid { display: grid; grid-template-columns: 112px 1fr; gap: 11px 12px; font-size: 11px; }
    .kv-label { color: #8a93a0; }
    .kv-value { color: #39404a; }

    .form-section { padding: 19px 20px 2px; border-bottom: 1px solid var(--line); }
    .form-section:last-child { border-bottom: 0; }
    .form-section-title { margin: 0 0 16px; color: #2d3239; font-size: 15px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 22px; }
    .form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: flex; gap: 4px; margin-bottom: 7px; color: #5f6875; font-size: 11px; font-weight: 650; }
    .field label.required::before { content: "*"; color: var(--danger); }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: #333a43;
      background: #fff;
      font-size: 12px;
    }
    .field input, .field select { height: 38px; padding: 0 10px; }
    .field textarea { min-height: 100px; padding: 10px; resize: vertical; line-height: 1.6; }
    .field input[readonly] { color: #7e8793; background: #f7f8fa; }
    .field-help { margin-top: 5px; color: #969faa; font-size: 10px; line-height: 1.5; }
    .field-error { margin-top: 5px; color: var(--danger); font-size: 10px; }

    .switch-row { min-height: 38px; display: flex; align-items: center; gap: 9px; }
    .switch { position: relative; width: 38px; height: 21px; flex: 0 0 auto; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch span { position: absolute; inset: 0; border-radius: 12px; background: #c7cdd5; transition: .18s ease; }
    .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: .18s ease; }
    .switch input:checked + span { background: var(--primary); }
    .switch input:checked + span::after { translate: 17px 0; }

    .form-footer { display: flex; justify-content: flex-end; gap: 9px; padding: 17px 20px; background: #fbfcfd; }
    .form-alert { margin: 16px 20px 0; padding: 10px 12px; border-radius: 7px; font-size: 11px; line-height: 1.55; }
    .form-alert.error { color: #b83530; background: #fff0ee; border: 1px solid #f3c4c0; }
    .form-alert.info { color: #2e669e; background: #edf6ff; border: 1px solid #c9e2fb; }
    .form-alert.success { color: #18724e; background: #ebf9f2; border: 1px solid #c4ead8; }

    .media-config {
      display: grid;
      grid-template-columns: 118px 1fr;
      gap: 13px;
      align-items: center;
      min-height: 86px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fafbfd;
    }
    .media-thumb {
      position: relative;
      height: 64px;
      overflow: hidden;
      border-radius: 8px;
      color: #fff;
      background:
        radial-gradient(circle at 74% 28%, rgba(255,238,121,.55), transparent 24%),
        linear-gradient(135deg,#ef4437,#ff943f);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
    }
    .media-thumb.supply {
      background:
        radial-gradient(circle at 74% 28%, rgba(221,255,179,.48), transparent 24%),
        linear-gradient(135deg,#128d78,#45bd82);
    }
    .media-thumb.share::after {
      content: "分享卡片";
      position: absolute;
      right: 6px;
      top: 6px;
      padding: 2px 5px;
      border-radius: 8px;
      background: rgba(0,0,0,.18);
      font-size: 8px;
    }
    .media-thumb span {
      position: absolute;
      left: 9px;
      bottom: 9px;
      font-size: 10px;
      font-weight: 800;
    }
    .media-meta strong { display: block; color: #39414b; font-size: 11px; }
    .media-meta p { margin: 5px 0 8px; color: #939ca8; font-size: 9px; line-height: 1.45; }
    .media-actions { display: flex; flex-wrap: wrap; gap: 7px; }

    .compact-textarea { min-height: 74px !important; }
    .readonly-box {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: #606a77;
      background: #f7f8fa;
      font-size: 11px;
    }
    .readonly-box .status { margin-left: auto; }

    .sub-tabs {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f6f8fb;
    }
    .sub-tab {
      min-height: 31px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      color: #697381;
      background: transparent;
      font-size: 11px;
    }
    .sub-tab.active {
      color: var(--primary);
      background: #fff;
      box-shadow: 0 2px 8px rgba(49,76,108,.08);
      font-weight: 700;
    }
    .daily-probability-summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(104px, 1fr));
      gap: 8px;
      width: 100%;
      margin-bottom: 14px;
    }
    .day-probability-card {
      padding: 10px 11px;
      border: 1px solid #d8e7f8;
      border-radius: 8px;
      background: #f6faff;
    }
    .day-probability-card span { display: block; color: #728299; font-size: 9px; }
    .day-probability-card b { display: block; margin-top: 5px; color: var(--primary); font-size: 16px; }
    .day-probability-card small { display: block; margin-top: 3px; color: #9aa5b2; font-size: 8px; }
    .probability-cell { min-width: 84px; text-align: center; }
    .probability-cell .inline-input { width: 68px; }
    .daily-input-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .daily-input-grid .field-help { margin: 0 0 4px; text-align: center; }

    .preview-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
    .phone-preview {
      overflow: hidden;
      border: 8px solid #20242a;
      border-radius: 28px;
      background: #fff4df;
      box-shadow: 0 18px 36px rgba(37,51,69,.16);
    }
    .phone-preview-bar { padding: 10px; color: #fff; background: #e94b38; text-align: center; font-size: 10px; font-weight: 700; }
    .phone-preview-hero {
      min-height: 178px;
      padding: 27px 17px;
      color: #fff;
      background:
        radial-gradient(circle at 72% 70%, rgba(255,238,105,.55), transparent 27%),
        linear-gradient(145deg,#ed4436,#ff973f);
      text-align: center;
    }
    .phone-preview-hero.supply { background: linear-gradient(145deg,#128d78,#45bd82); }
    .phone-preview-hero small { font-size: 9px; opacity: .88; }
    .phone-preview-hero h3 { margin: 9px 0 6px; font-size: 22px; }
    .phone-preview-hero p { margin: 0; font-size: 10px; }
    .phone-preview-body { padding: 13px; }
    .phone-preview-card { margin-bottom: 9px; padding: 11px; border-radius: 10px; background: #fff; box-shadow: 0 6px 16px rgba(118,76,40,.08); font-size: 9px; line-height: 1.6; }
    .preview-copy h4 { margin: 0 0 8px; color: #2d333b; font-size: 15px; }
    .preview-copy p { margin: 0 0 12px; color: #6f7986; font-size: 11px; line-height: 1.65; }
    .preview-list { display: grid; gap: 8px; }
    .preview-list div { padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 10px; }

    .share-preview-card {
      position: relative;
      min-height: 220px;
      padding: 23px;
      overflow: hidden;
      border-radius: 13px;
      color: #fff;
      background:
        radial-gradient(circle at 84% 20%, rgba(255,239,121,.45), transparent 24%),
        linear-gradient(135deg,#ef4537,#ff903c);
      box-shadow: 0 16px 34px rgba(59,75,94,.16);
    }
    .share-preview-card.supply { background: linear-gradient(135deg,#128d78,#45bd82); }
    .share-preview-card::after { content: "🎁"; position: absolute; right: 23px; bottom: 17px; font-size: 72px; }
    .share-preview-card small { opacity: .84; font-weight: 700; }
    .share-preview-card h3 { width: 70%; margin: 10px 0 7px; font-size: 25px; line-height: 1.25; }
    .share-preview-card p { width: 68%; margin: 0; font-size: 11px; line-height: 1.6; }

    .probability-summary {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 11px 13px;
      border: 1px solid #cfe3fb;
      border-radius: 8px;
      color: #42698f;
      background: #f2f8ff;
      font-size: 11px;
    }
    .probability-summary b { color: var(--primary); font-size: 14px; }

    .inline-input {
      width: 74px;
      height: 32px;
      padding: 0 7px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      color: #38404a;
      background: #fff;
      font-size: 11px;
      text-align: center;
    }
    .release-cell { min-width: 58px; text-align: center; }
    .release-total.ok { color: var(--success); font-weight: 700; }
    .release-total.bad { color: var(--danger); font-weight: 700; }
    .sticky-actions { position: sticky; right: 0; background: inherit; }

    .empty { padding: 44px 20px; color: #9aa3af; text-align: center; }
    .empty-icon { margin-bottom: 8px; font-size: 35px; }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(28,37,48,.48);
      backdrop-filter: blur(2px);
    }
    .modal-layer.open { display: flex; }
    .modal {
      width: min(680px, calc(100vw - 48px));
      max-height: calc(100vh - 48px);
      overflow: auto;
      border-radius: 11px;
      background: #fff;
      box-shadow: 0 25px 80px rgba(24,35,49,.28);
      animation: modal-in .18s ease both;
    }
    .modal.small { width: min(460px, calc(100vw - 48px)); }
    .modal.wide { width: min(920px, calc(100vw - 48px)); }
    @keyframes modal-in { from { opacity: 0; transform: translateY(10px) scale(.985); } }
    .modal-header { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; padding: 0 19px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.97); }
    .modal-header h3 { margin: 0; color: #282d34; font-size: 16px; }
    .modal-close { width: 31px; height: 31px; border: 0; border-radius: 7px; color: #8b95a2; background: #f5f7f9; font-size: 18px; }
    .modal-body { padding: 19px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 19px; border-top: 1px solid var(--line); background: #fafbfc; }

    .confirm-icon { width: 52px; height: 52px; display: grid; place-items: center; margin-bottom: 13px; border-radius: 50%; color: #b97900; background: #fff2cf; font-size: 26px; }
    .confirm-title { margin: 0 0 7px; color: #292e35; font-size: 18px; }
    .confirm-desc { margin: 0; color: #7c8692; font-size: 12px; line-height: 1.65; }

      function saveActivityForm() {
        const name = $('#activityName').value.trim();
        const subtitle = $('#activitySubtitle').value.trim();
        const start = $('#activityStart').value;
        const end = $('#activityEnd').value;
        const base = Number($('#baseChances').value);
        const helps = Number($('#helpsPerChance').value);
        const helperLimit = Number($('#helperDailyLimit').value);
        const winLimit = Number($('#dailyWinLimit').value);
        const introduction = $('#activityIntroduction').value.trim();
        const rules = $('#activityRules').value.trim();
        const disclaimer = $('#activityDisclaimer').value.trim();
        const shareTitle = $('#shareTitle').value.trim();
        const sharePromotion = $('#sharePromotion').value.trim();
        const assistJumpEnabled = $('#assistJumpEnabled').checked;
        const assistJumpPath = $('#assistJumpPath').value.trim();
        const assistJumpButtonText = $('#assistJumpButtonText').value.trim();
        const errors = [];
        if (!name) errors.push('活动主题不能为空');
        if (!subtitle) errors.push('活动副标题不能为空');
        if (!start || !end || new Date(start) >= new Date(end)) errors.push('结束时间必须晚于开始时间');
        if (!Number.isInteger(base) || base < 1) errors.push('基础抽奖机会必须为大于0的整数');
        if (!Number.isInteger(helps) || helps < 1) errors.push('助力人数必须为大于0的整数');
        if (helperLimit !== 1) errors.push('本活动每名好友每日助力上限应为1次');
        if (winLimit !== 1) errors.push('本活动每个账号每日中奖上限应为1次');
        if (!introduction) errors.push('活动介绍不能为空');
        if (!rules) errors.push('活动规则不能为空');
        if (!disclaimer) errors.push('免责声明不能为空');
        if (!shareTitle) errors.push('分享卡片标题不能为空');
        if (shareTitle.length > 32) errors.push('分享卡片标题不能超过32字');
        if (!sharePromotion) errors.push('项目/活动宣传语不能为空');
        if (sharePromotion.length > 60) errors.push('项目/活动宣传语不能超过60字');
        if (assistJumpEnabled && !/^\/pages\/[a-zA-Z0-9_/-]+$/.test(assistJumpPath)) errors.push('助力成功目标路径必须是以/pages/开头的同一小程序页面');
        if (assistJumpEnabled && (!assistJumpButtonText || assistJumpButtonText.length > 12)) errors.push('助力成功按钮文案应为1—12个字');
        if (errors.length) { showActivityFormError(errors); return; }

      function readPrizeConfigTable() {
        const draft = [];
        $$('#prizeConfigTable tbody tr').forEach(row => {
          const old = prizeConfigs.find(item=>item.id===row.dataset.configId);
          const probabilityInputs = $$('[data-probability-index]',row);
          const releaseInputs = $$('[data-release-index]',row);
          draft.push({
            ...old,
            label:$('[data-field="label"]',row).value.trim(),
            qty:Number($('[data-field="qty"]',row).value),
            probabilities:probabilityInputs.length ? probabilityInputs.map(input=>Number(input.value)) : [...old.probabilities],
            release:releaseInputs.length ? releaseInputs.map(input=>Number(input.value)) : [...old.release]
          });
        });
        return draft;
      }

      function validateAndSavePrizeConfig() {
        const draft = readPrizeConfigTable();
        const errors = [];
        draft.forEach(item => {
          const prize = prizeById(item.prizeId);
          if (!item.label) errors.push(`${prize.name}的奖项名称不能为空`);
          if (!Number.isInteger(item.qty) || item.qty < 1) errors.push(`${prize.name}的配置数量不正确`);
          if (item.qty > prize.total) errors.push(`${prize.name}配置数量超过总库存${prize.total}`);
          if (item.probabilities.some(value=>!Number.isFinite(value)||value<0||value>100)) errors.push(`${prize.name}每天的中奖概率都应在0—100之间`);
          if (item.release.some(value=>!Number.isInteger(value)||value<0)) errors.push(`${prize.name}的分日数量必须为非负整数`);
          if (sum(item.release) !== item.qty) errors.push(`${prize.name}的分日释放合计必须等于配置数量${item.qty}`);
        });
        dailyProbabilityTotals(draft).forEach((total,index)=>{
          if(total>100) errors.push(`${dates[index]}全部奖品中奖概率之和为${formatPercent(total)}，不能超过100%`);
        });
        if (errors.length) {
          $('#prizeConfigAlert').innerHTML = `<div class="form-alert error"><b>无法保存：</b>${errors.slice(0,5).join('；')}${errors.length>5?'；请继续检查其他奖品配置':''}</div>`;
          $('#prizeConfigAlert').scrollIntoView({behavior:'smooth',block:'center'});
          return;
        }
        draft.forEach(item=>Object.assign(prizeConfigs.find(config=>config.id===item.id),item));
        $('#prizeConfigAlert').innerHTML = '';
        toast(`${ui.prizeConfigMode==='probability'?'每日中奖概率':'每日新增库存'}配置保存成功`,'success');
        renderActivityDetail();
      }

      function updateProbabilityPreview() {
        const table = $('#prizeConfigTable');

        if (ui.prizeConfigMode === 'probability') {
          dates.forEach((date,index)=>{
            const total = sum($$(`[data-probability-index="${index}"]`,table).map(input=>Number(input.value)||0));
            const totalEl = $(`#dayTotal${index}`);
            const missEl = $(`#dayMiss${index}`);
            if(totalEl) totalEl.textContent = formatPercent(total);
            if(missEl) missEl.textContent = `未中奖 ${formatPercent(Math.max(0,100-total))}`;
          });
        }
        $$('tbody tr',table).forEach(row=>{
          const qty = Number($('[data-field="qty"]',row).value)||0;
          const releaseTotal = sum($$('.release-input',row).map(input=>Number(input.value)||0));

        });
      }

      }

      function openNewPrize() {
        openModal(`<div class="modal-header"><h3>新增奖品</h3><button class="modal-close" data-action="close-modal">×</button></div><form id="newPrizeForm" novalidate><div class="modal-body"><div id="newPrizeAlert"></div><div class="form-grid">${field('奖品名称','newPrizeName','',true)}${field('总库存','newPrizeTotal',1,true,'number')}<div class="field full"><label class="required">奖品说明</label><textarea id="newPrizeDescription" placeholder="填写规格、领取方式等必要说明"></textarea></div></div></div><div class="modal-footer"><button class="btn" type="button" data-action="close-modal">取消</button><button class="btn primary" type="submit">保存奖品</button></div></form>`, 'small');
      }

      function submitNewPrize() {
        const name=$('#newPrizeName').value.trim(); const total=Number($('#newPrizeTotal').value); const description=$('#newPrizeDescription').value.trim(); const errors=[];
        if(!name) errors.push('奖品名称不能为空'); if(!Number.isInteger(total)||total<1) errors.push('总库存必须为大于0的整数'); if(!description) errors.push('奖品说明不能为空');
        if(errors.length){ $('#newPrizeAlert').innerHTML=`<div class="form-alert error" style="margin:0 0 14px">${errors.join('；')}</div>`; return; }
        prizes.push({id:`P${String(prizes.length+1).padStart(3,'0')}`,name,total,occupied:0,description,activities:0}); closeModal(); renderPrizeList(); toast('奖品新增成功','success');
      }

      function savePrizeForm() {
        const prize=prizeById(ui.selectedPrize); const name=$('#prizeName').value.trim(); const total=Number($('#prizeTotal').value); const description=$('#prizeDescription').value.trim(); const errors=[];
        if(!name) errors.push('奖品名称不能为空'); if(!Number.isInteger(total)||total<prize.occupied) errors.push(`总库存不能小于已占用数量${prize.occupied}`); if(!description) errors.push('奖品说明不能为空');
        if(errors.length){ $('#prizeFormAlert').innerHTML=`<div class="form-alert error">${errors.join('；')}</div>`; return; }
        Object.assign(prize,{name,total,description}); $('#prizeFormAlert').innerHTML=''; toast('奖品信息保存成功','success'); renderPrizeDetail();
      }

      function confirmPause() {
        openModal(`<div class="modal-body"><div class="confirm-icon">Ⅱ</div><h3 class="confirm-title">确认暂停活动？</h3><p class="confirm-desc">暂停后，小程序将提示“活动暂时暂停”，用户不能抽奖或助力；已有抽奖机会和中奖记录不会改变。</p></div><div class="modal-footer"><button class="btn" data-action="close-modal">取消</button><button class="btn warning" data-action="confirm-pause">确认暂停</button></div>`, 'small');
      }

      document.addEventListener('click', event => {
        const nav=event.target.closest('[data-nav]');
        if(nav){ ui.view=nav.dataset.nav; ui.activityTab='overview'; render(); return; }
        const tab=event.target.closest('[data-activity-tab]');
        if(tab){ ui.activityTab=tab.dataset.activityTab; renderActivityDetail(); return; }
        const prizeMode=event.target.closest('[data-prize-config-mode]');
        if(prizeMode){ ui.prizeConfigMode=prizeMode.dataset.prizeConfigMode; renderActivityDetail(); return; }
        const el=event.target.closest('[data-action]');
        if(!el) return;
        const action=el.dataset.action;
        if(action==='account') toast('账号菜单：孝感市运营账号');
        if(action==='toggle-sidebar'){ $('#sidebar').classList.toggle('collapsed'); $('#main').classList.toggle('expanded'); }
        if(action==='close-modal') closeModal();
        if(action==='new-activity') openNewActivity();
        if(action==='view-activity') { if(el.dataset.id!==activity.id){ toast('历史活动在本次原型中仅展示列表'); return; } ui.view='activityDetail'; ui.activityTab='overview'; render(); }
        if(action==='back-activities'){ ui.view='activities'; render(); }
        if(action==='copy-link'){ navigator.clipboard?.writeText(activity.pagePath).catch(()=>{}); toast('小程序页面地址已复制','success'); }
        if(action==='export-winners') toast('中奖名单已生成，开始导出 Excel','success');
        if(action==='export-participants') toast('参与及助力记录已生成，开始导出 Excel','success');
        if(action==='pause-activity') confirmPause();
        if(action==='confirm-pause'){ activity.status='paused'; activities[0]=activity; closeModal(); renderActivityDetail(); toast('活动已暂停','success'); }
        if(action==='resume-activity'){ activity.status='active'; activities[0]=activity; renderActivityDetail(); toast('活动已恢复进行','success'); }
        if(action==='change-theme-image') openImagePicker('theme');
        if(action==='change-share-image') openImagePicker('share');
        if(action==='select-config-image') selectConfigImage(el.dataset.imageKind,el.dataset.imageStyle);
        if(action==='preview-miniapp') openMiniappPreview();
        if(action==='preview-share-card') openSharePreview();
        if(action==='preview-assist-jump') openAssistJumpPreview();
        if(action==='reset-basic') { renderActivityDetail(); toast('已恢复为当前已保存配置'); }
        if(action==='add-activity-prize') openAddPrize();
        if(action==='save-prize-config') validateAndSavePrizeConfig();
        if(action==='reset-prize-config') { renderActivityDetail(); toast('已恢复为当前已保存奖品配置'); }
        if(action==='remove-activity-prize') {
          const config=prizeConfigs.find(i=>i.id===el.dataset.configId);
          if(config.won>0){ toast('该奖品已有中奖记录，不能从活动中移除','error'); return; }
          openModal(`<div class="modal-body"><div class="confirm-icon">!</div><h3 class="confirm-title">确认移除活动奖品？</h3><p class="confirm-desc">移除后，未中奖库存将释放回全局奖品库。该操作仅允许在没有中奖记录时执行。</p></div><div class="modal-footer"><button class="btn" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-remove-prize" data-config-id="${config.id}">确认移除</button></div>`, 'small');
        }
        if(action==='confirm-remove-prize'){
          const index=prizeConfigs.findIndex(i=>i.id===el.dataset.configId); const config=prizeConfigs[index]; const prize=prizeById(config.prizeId); prize.occupied-=config.qty; prize.activities=Math.max(0,prize.activities-1); prizeConfigs.splice(index,1); closeModal(); renderActivityDetail(); toast('活动奖品已移除，库存已释放','success');
        }
        if(action==='participant-detail') openParticipantDetail(el.dataset.id);
        if(action==='winner-detail') openWinnerDetail(el.dataset.id);
        if(action==='mark-contacted'){ const item=winners.find(i=>i.id===el.dataset.id); item.status='waitingClaim'; item.contact='已联系'; closeModal(); renderActivityDetail(); toast('已标记为联系成功，等待现场核销','success'); }
        if(action==='mark-unreachable'){ const item=winners.find(i=>i.id===el.dataset.id); item.status='unreachable'; item.contact='联系不上'; closeModal(); renderActivityDetail(); toast('已记录联系不上，可稍后恢复并继续联系'); }
        if(action==='restore-contact'){ const item=winners.find(i=>i.id===el.dataset.id); item.status='waitingContact'; item.contact='未联系'; closeModal(); renderActivityDetail(); toast('已恢复为待联系状态','success'); }
        if(action==='open-claim') openClaim(el.dataset.id);
        if(action==='new-prize') openNewPrize();
        if(action==='view-prize'){ ui.selectedPrize=el.dataset.id; ui.view='prizeDetail'; render(); }
        if(action==='back-prizes'){ ui.view='prizes'; render(); }
        if(action==='refresh-activities') toast('活动列表已刷新');
        if(action==='refresh-prizes') toast('奖品列表已刷新');
      });

      document.addEventListener('input', event => {
        if(event.target.id==='activitySearch') filterActivities();
        if(event.target.id==='participantSearch') filterParticipants();
        if(event.target.id==='winnerSearch') filterWinners();
        if(event.target.id==='prizeSearch') filterPrizes();
        if(event.target.closest('#prizeConfigTable')) updateProbabilityPreview();
      });
      document.addEventListener('change', event => {
        if(event.target.id==='activityStatusFilter') filterActivities();
        if(event.target.id==='participantFilter') filterParticipants();
        if(event.target.id==='winnerStatusFilter') filterWinners();
        if(event.target.closest('#prizeConfigTable')) updateProbabilityPreview();
      });
      document.addEventListener('submit', event => {
        event.preventDefault();
        if(event.target.id==='activityForm') saveActivityForm();
        if(event.target.id==='newActivityForm') submitNewActivity();
        if(event.target.id==='addPrizeForm') submitAddPrize();
        if(event.target.id==='claimForm') submitClaim(event.target);
        if(event.target.id==='newPrizeForm') submitNewPrize();
        if(event.target.id==='prizeForm') savePrizeForm();
      });
      $('#modalLayer').addEventListener('click', event => { if(event.target===$('#modalLayer')) closeModal(); });

      function sum(values){ return values.reduce((a,b)=>a+(Number(b)||0),0); }
      function dailyProbabilityTotals(configs=prizeConfigs){ return dates.map((_,index)=>sum(configs.map(item=>item.probabilities[index]))); }
      function formatPercent(value){ return `${Number(value).toFixed(2).replace(/\.?0+$/,'')}%`; }
      function dailyProbabilityCards(totals){ return totals.map((total,index)=>`<div class="day-probability-card"><span>${dates[index]} · 全部奖品</span><b id="dayTotal${index}">${formatPercent(total)}</b><small id="dayMiss${index}">未中奖 ${formatPercent(Math.max(0,100-total))}</small></div>`).join(''); }
      function formatNumber(value){ return Number(value).toLocaleString('zh-CN'); }
      function fmtDate(value){ return value.replace('T',' ').slice(0,16); }
      function fmtDateTime(value){ return value.replace('T',' '); }
      function maskPhone(value){ return `${value.slice(0,3)}****${value.slice(-4)}`; }

      render();
    })();
  </script>
</body>
</html>
